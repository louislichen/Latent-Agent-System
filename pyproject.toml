[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-agent-system"
version = "0.1.0"
description = "Benchmarks for serving latent multi-agent workflows"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "numpy>=1.26"]
native = ["httpx>=0.27"]

[project.scripts]
latent-agent = "latent_agent_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
